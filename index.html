<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Tell browsers not to scale the viewport automatically - keep this in mind! -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- I'm taking advantage of the TailWind CSS Framework here -->
  <script src="https://cdn.tailwindcss.com"></script> 
  <link href="css/main.css" rel="stylesheet"/>
  <title>Church Bingo 260</title>
</head>

<body>
  <header class="bg-white dark:bg-gray-800">
    <h1 class=" text-5xl text-amber-500">Church Bingo!</h1>
    <nav>
      <ul>
        <li><a href="index.html" class="text-white">Home</a></li>
        <li><a href="html/setup.html" class="text-white">Setup</a></li>
        <li><a href="html/bingo.html" class="text-white">Play</a></li>
        <li><a href="html/scores.html" class="text-white">Scores</a></li>
        <li><a href="html/about.html" class="text-white">About</a></li>
      </ul>
    </nav>

    <hr />
  </header>

  <main>
    <div class="filler"></div>
    <div id="login-section" class="bg-gray-200">
      <h1>Join to Play Bingo</h1>
      <form method="get" action="setup.html">
        <div>
          <label for="identify">Email</label>
          <input id="identify" type="text" placeholder="your@email.com" />
        </div>
        <div>
          <label for="id-pass">Password</label>
          <input id="id-pass" type="password" placeholder="password" />
        </div>
        <button type="submit">Login</button>
      </form>
    </div>
    <div class="filler"></div>
  </main>

  <footer>
    <hr />
    <span class="text-reset">Mason Grant</span>
    <br />
    <a href="https://github.com/TheNewGrant/startup">GitHub</a>
  </footer>
</body>

</html>
