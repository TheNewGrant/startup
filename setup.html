<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setup</title>
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <header>
      <h1>Setup Your Game</h1>
      <nav>
        <menu>
          <li><a href="index.html">Home</a></li>
          <li><a href="setup.html">Setup</a></li>
          <li><a href="bingo.html">Play</a></li>
          <li><a href="scores.html">Scores</a></li>
          <li><a href="about.html">About</a></li>
        </menu>
      </nav>

      <hr />
    </header>

    <main>
      <h1>Settings</h1>
      <form method="get" action="bingo.html">
        <div>
          <label>Difficulty:</label>
          <button type="submit">Easy</button>
          <button type="submit">Medium</button>
          <button type="submit">Hard</button>
        </div>
        <div>
          <label>Bingo Loadout:</label>
          <button type="submit">Fast & Testimony Meeting</button>
          <button type="submit">General Conference</button>
          <button type="submit">Custom</button>
          <input type="text" placeholder="Custom Link:" />
        </div>
        <div>
          <label>Modifiers:</label>
          <button type="submit">Focus Mode</button>
          <button type="submit">Repeats Allowed</button>
        </div>
        <br/>
        <button type="submit">Start Game</button>
        <button type="submit">Join Game</button>
        <input type="text" placeholder="Game ID"/>
      </form>
    </main>

    <footer>
      <hr />
      <span class="text-reset">Mason Grant</span>
      <br />
      <a href="https://github.com/TheNewGrant/startup">GitHub</a>
    </footer>
  </body>
</html>
