<body>
  <header>
    <h1>Setup Your Game</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>

  <main>
    <h1>Settings</h1>
    <form method="get" action="bingo.html">
      <div>
        <label>Difficulty:</label>
        <button type="button">Easy</button>
        <button type="button">Medium</button>
        <button type="button">Hard</button>
      </div>
      <div>
        <label>Bingo Loadout:</label>
        <button type="button">Fast & Testimony Meeting</button>
        <button type="button">General Conference</button>
        <button type="button">Custom</button>
        <input type="text" placeholder="Custom Link:" />
      </div>
      <div>
        <label>Modifiers:</label>
        <button type="button">Focus Mode</button>
        <button type="button">Repeats Allowed</button>
      </div>
      <br />
      <div>
        <button type="submit">Start Game</button>
        <button type="submit">Join Game</button>
        <input type="text" placeholder="Game ID" />
      </div>
    </form>
