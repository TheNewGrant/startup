<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Church Bingo</title>
  <script src="https://cdn.tailwindcss.com"></script> 
  <link href="../css/main.css" rel="stylesheet"/>
  <link href="../css/bingo.css" rel="stylesheet"/>
</head>

<body>
  <header class="bg-gray-50 dark:bg-gray-800">
    <h1 class="caveat-brush-font text-5xl text-amber-500">Play Bingo</h1>
    <nav>
      <ul>
        <li><a href="../index.html" class="text-gray-500 hover:text-red-300 dark:hover:text-white">Home</a></li>
        <li><a href="setup.html" class="text-gray-500 hover:text-red-300 dark:hover:text-white">Setup</a></li>
        <li><a href="bingo.html" class="text-red-400 hover:text-red-300 dark:text-white dark:hover:text-amber-400" style="font-weight:800;">Play</a></li>
        <li><a href="scores.html" class="text-gray-500 hover:text-red-300 dark:hover:text-white">Scores</a></li>
        <li><a href="about.html" class="text-gray-500 hover:text-red-300 dark:hover:text-white">About</a></li>
      </ul>
    </nav>

    <hr />
  </header>

  <main class="dark:bg-slate-600">
    <section id="realtime-updates" class="bg-gray-200 dark:bg-gray-500 dark:text-white">
      <p id="game-id"><b>Game ID:</b> 12345</p>
      <div class="players">
        <b>Player:</b>
        <span class="player-name">Mason</span>
      </div>
      <br/>
      <hr/>
      <br/>
      <ul class="notification">
        <li class="player-name">Jeff joined the bingo game</li>
        <li class="player-name">George scored a bingo</li>
        <li class="player-name">Anna completed a category</li>
      </ul>
      <br/>
      <hr/>
      <br/>
      <div>
        <label for="count">Score</label>
        <input class="bg-white dark:bg-gray-700" type="text" id="count" value="--" readonly />
      </div>

    </section>
    <section id="board-section" class="bg-gray-200 dark:bg-gray-500 dark:text-white">
      <!-- Bingo Table: The images in each square come from the API I intend to use (Iconify) -->
      <table id="bingo-board" class="bg-white dark:bg-gray-600">
        <caption>Bingo Board</caption>
        <tr>
          <td class="bingo-tile" style="border-top-left-radius: 20px;">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/alarm-clock.svg" alt="alarm clock"/>
              <p>Neighbor falls asleep</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/bacon.svg" alt="bacon"/>
              <p>Child caught snacking</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/boy-medium.svg" alt="boy"/>
              <p>Boy bears testimony</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/balloon.svg" alt="balloon"/>
              <p>Speaker off topic</p>

            </button>
          </td>
          <td class="bingo-tile" style="border-top-right-radius: 20px;">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/bat.svg" alt="bat"/>
              <p>Animal/Insect distraction</p>

            </button>
          </td>
        </tr>
        <tr>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/blue-book.svg" alt="blue book"/>
              <p>Book of Mormon cited</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/call-me-hand.svg" alt="call me hand"/>
              <p>Phone rings</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/castle.svg" alt="castle"/>
              <p>Topic: Heaven</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/cinema.svg" alt="cinema"/>
              <p>Church activity mentioned</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/crayon.svg" alt="crayon"/>
              <p>Child coloring</p>

            </button>
          </td>
        </tr>
        <tr>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/dna.svg" alt="dna"/>
              <p>Topic: Family History</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/face-with-raised-eyebrow.svg" alt="face with raised eyebrow"/>
              <p>Questionable topic mentioned</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/female-sign.svg" alt="female sign"/>
              <p>Woman bears testimony</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/flamingo.svg" alt="flamingo"/>
              <p>Pink article of clothing</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/frowning-face-with-open-mouth.svg" alt="frowning face with open mouth"/>
              <p>Shocking turn of events</p>

            </button>
          </td>
        </tr>
        <tr>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/glasses.svg" alt="glasses"/>
              <p>Glasses worn by speaker</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/guitar.svg" alt="guitar"/>
              <p>Musical Number</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img
                src="https://api.iconify.design/fluent-emoji-flat/hand-with-index-finger-and-thumb-crossed-medium.svg" alt="hand with index finger and thumb crossed"/>
              <p>Coincidence/luck mentioned</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/heart-hands-medium.svg" alt="heart hands"/>
              <p>Topic: Love</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/hospital.svg" alt="hospital"/>
              <p>Miracle story</p>

            </button>
          </td>
        </tr>
        <tr>
          <td class="bingo-tile" style="border-bottom-left-radius: 20px;">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/infinity.svg" alt="infinity"/>
              <p>Topic: Atonement</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/joker.svg" alt="joker"/>
              <p>Joke told (laughter required)</p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/knot.svg" alt="knot"/>
              <p>Bow/Bracelet/Necklace article </p>

            </button>
          </td>
          <td class="bingo-tile">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/laptop.svg" alt="laptop"/>
              <p>Phone used on podium</p>

            </button>
          </td>
          <td class="bingo-tile" style="border-bottom-right-radius: 20px;">
            <button>
              <img src="https://api.iconify.design/fluent-emoji-flat/light-blue-heart.svg" alt="light blue heart"/>
              <p>Topic: Service</p>

            </button>
          </td>
        </tr>
      </table>
    </section>
  </main>

  <footer class="bg-gray-50 dark:bg-gray-800">
    <hr />
    <span class="text-reset dark:text-white">Mason Grant:</span>
    <a href="https://github.com/TheNewGrant/startup" class="text-red-300 dark:text-amber-400">GitHub</a>
  </footer>
</body>

</html>
