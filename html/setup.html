<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setup</title>
  <script src="https://cdn.tailwindcss.com"></script> 
  <link href="../css/main.css" rel="stylesheet"/>
  <link href="../css/setup.css" rel="stylesheet"/>
</head>

<body>
  <header class="bg-gray-50 dark:bg-gray-800">
    <h1 class="caveat-brush-font text-5xl text-amber-500">Setup the Game</h1>
    <nav>
      <ul>
        <li><a href="../index.html" class="text-gray-500 hover:text-red-300 dark:hover:text-white">Home</a></li>
        <li><a href="setup.html" class="text-red-400 hover:text-red-300 dark:text-white dark:hover:text-amber-400" style="font-weight:800;">Setup</a></li>
        <li><a href="bingo.html" class="text-gray-500 hover:text-red-300 dark:hover:text-white">Play</a></li>
        <li><a href="scores.html" class="text-gray-500 hover:text-red-300 dark:hover:text-white">Scores</a></li>
        <li><a href="about.html" class="text-gray-500 hover:text-red-300 dark:hover:text-white">About</a></li>
      </ul>
    </nav>

    <hr />
  </header>

  <main class="dark:bg-slate-600">
    <section class="bg-gray-200">
      <h1 id="setup" class="caveat-brush-font">Settings</h1>
      <form method="get" action="bingo.html">
        <div id="difficulty" class="settings-section">
          <label>Difficulty:</label>
          <button class="bg-red-400 hover:bg-red-500 dark:bg-amber-400 dark:hover:bg-amber-500" type="button">Easy</button>
          <button class="bg-red-400 hover:bg-red-500 dark:bg-amber-400 dark:hover:bg-amber-500" type="button">Medium</button>
          <button class="bg-red-400 hover:bg-red-500 dark:bg-amber-400 dark:hover:bg-amber-500" type="button">Hard</button>
        </div>
        <div id="bingo-loadout" class="settings-section">
          <label>Bingo Loadout:</label>
          <button class="dark:bg-red-400 dark:hover:bg-red-500 bg-amber-400 hover:bg-amber-500" type="button">Fast & Testimony Meeting</button>
          <button class="dark:bg-red-400 dark:hover:bg-red-500 bg-amber-400 hover:bg-amber-500" type="button">General Conference</button>
          <div>
            <button class="dark:bg-red-400 dark:hover:bg-red-500 bg-amber-400 hover:bg-amber-500" type="button">Custom:</button>
            <input type="text" placeholder="Custom Loadout Link:" />
          </div>
        </div>
        <div id="modifiers" class="settings-section">
          <label>Modifiers:</label>
          <button class="bg-blue-400 hover:bg-blue-500 dark:bg-green-400 dark:hover:bg-green-500" type="button">Focus Mode</button>
          <button class="bg-blue-400 hover:bg-blue-500 dark:bg-green-400 dark:hover:bg-green-500" type="button">Repeats Allowed</button>
        </div>
        <br />
        <div id="enter-game" class="settings-section">
          <button class="dark:bg-blue-400 dark:hover:bg-blue-500 bg-green-400 hover:bg-green-500" type="submit">Start Game</button>
          <button class="dark:bg-blue-400 dark:hover:bg-blue-500 bg-green-400 hover:bg-green-500" type="submit">Join Game:</button>
          <input type="text" placeholder="Game ID" />
          <label id="warning">Note: If the inputted ID is non-existent, a new game with that ID will be hosted.</label>
        </div>
      </form>
    </section>
  </main>

  <footer class="bg-gray-50 dark:bg-gray-800">
    <hr />
    <span class="text-reset dark:text-white">Mason Grant:</span>
    <a href="https://github.com/TheNewGrant/startup" class="text-red-300 dark:text-amber-400">GitHub</a>
  </footer>
</body>

</html>
